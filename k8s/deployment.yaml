apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
  namespace: flask-faceapp
  labels:
    app: flask-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: flask-api
          image: ghcr.io/jryantiermore/face-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
