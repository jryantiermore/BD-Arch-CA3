apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jryantiermore/BD-Arch-CA3.git
    targetRevision: bdarch
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: flask-faceapp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
