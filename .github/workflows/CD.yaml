name: CD

on:
  push:
    branches: [ main ]

jobs:
  push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build image
      run: docker build -t ghcr.io/${{ github.repository_owner }}/mlops-pipeline:latest .

    - name: Push image
      run: docker push ghcr.io/${{ github.repository_owner }}/mlops-pipeline:latest
